[workspace]
members = [
  "loki-api",
  "loki-api/generate",
]

[package]
name = "tracing-loki"
description = "A tracing layer for shipping logs to Grafana Loki"
authors = ["hrxi <hrrrxi@gmail.com>"]
repository = "https://github.com/hrxi/tracing-loki"
keywords = ["tracing", "loki"]
version = "0.2.8"
license = "MIT/Apache-2.0"
edition = "2024"

[dependencies]
loki-api = { version = "0.1.0", path = "loki-api" }
reqwest = { version = "0.13.*", default-features = false }
snap = "1.1.*"
serde = { version = "1.0.*", features = ["derive"] }
serde_json = "1.0.*"
tokio = { version = "1.52.*", features = ["sync"] }
tracing = "0.1.*"
tracing-core = "0.1.*"
tracing-log = "0.2.*"
tracing-serde = "0.2.*"
tracing-subscriber = "0.3.*"
tracing-opentelemetry = "0.33.*"
url = "2.5.*"
opentelemetry = "0.32.*"

[dev-dependencies]
tokio = { version = "1.52.*", features = ["macros", "rt-multi-thread"] }

[features]
default = ["compat-0-2-1", "native-tls"]
compat-0-2-1 = []

native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls"]
